<title>Madkurven · Madkurven</title>
<style>
:root{--ink:#1E2420;--muted:#5d6660;--accent:#399F52;--line:#e4e8e5;--tint:#f3f7f4;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8ece9;--muted:#a3aca6;--accent:#5cc275;--line:#2c332e;--tint:#1b211d;--bg:#121614}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px 80px}
.brand{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:24px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
h2{font-size:20px;margin:40px 0 8px}
h3{font-size:17px;margin:28px 0 6px}
a{color:var(--accent)}
p,ul{margin:0 0 14px}
ul{padding-left:22px}
li{margin-bottom:6px}
blockquote{margin:16px 0;padding:12px 16px;background:var(--tint);border-left:4px solid var(--accent);border-radius:8px}
blockquote p:last-child{margin-bottom:0}
code{font-size:.9em;background:var(--tint);padding:1px 5px;border-radius:4px}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.table{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-weight:600}
nav{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
nav a{margin-right:16px}
</style>
</head>
<body>
